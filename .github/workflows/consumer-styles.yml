name: Consumer styles

on:
  pull_request:
    branches: [main]

jobs:
  packed-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        groundwork: ["4.3.2", "4"]
        react: ["18", "19"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pack the built library
        run: npm pack --ignore-scripts
      - name: Install packed library and consumer's Groundwork version
        run: npm install --prefix tests/consumer-styles --no-save --ignore-scripts --no-audit --no-fund ./usace-watermanagement-groundwork-water-*.tgz @usace/groundwork@${{ matrix.groundwork }} react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - name: Verify consumer production CSS
        run: node scripts/verify-consumer-styles.mjs
