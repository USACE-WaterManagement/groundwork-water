name: Deploy to GH Pages

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install library dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Pack library
        id: package
        shell: bash
        run: |
          package_path=$(npm pack --pack-destination "$RUNNER_TEMP" --json | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const [{ filename }] = JSON.parse(input);
              console.log(`${process.env.RUNNER_TEMP}/${filename}`);
            });
          ')
          package_version=$(node -p "require('./package.json').version")
          echo "path=$package_path" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci
        working-directory: ./docs

      - name: Install locally built Groundwork Water package
        env:
          PACKAGE_TARBALL: ${{ steps.package.outputs.path }}
        run: npm install --no-save --package-lock=false "$PACKAGE_TARBALL"
        working-directory: ./docs

      - name: Verify installed Groundwork Water version
        shell: bash
        env:
          LIBRARY_VERSION: ${{ steps.package.outputs.version }}
        working-directory: ./docs
        run: |
          installed_version=$(node -p \
            "require('./node_modules/@usace-watermanagement/groundwork-water/package.json').version")

          if [[ "$installed_version" != "$LIBRARY_VERSION" ]]; then
            echo "::error::Built Groundwork Water $LIBRARY_VERSION, but installed $installed_version."
            exit 1
          fi

          echo "Deploying Groundwork Water $installed_version" >> "$GITHUB_STEP_SUMMARY"

      - name: Build project
        env:
          VITE_HOMEPAGE: "https://usace-watermanagement.github.io/groundwork-water"
        run: npx vite build
        working-directory: ./docs

      - name: Upload production-ready build files
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
