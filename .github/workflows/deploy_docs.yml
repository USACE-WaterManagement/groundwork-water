name: Deploy to GH Pages

on:
  workflow_call:
    inputs:
      package_version:
        description: Exact Groundwork Water package version to deploy
        required: true
        type: string
  workflow_dispatch:
    inputs:
      package_version:
        description: Exact package version to deploy, or latest
        required: false
        default: latest
        type: string

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        working-directory: ./docs

      - name: Install requested Groundwork Water version
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: npm install --no-save "@usace-watermanagement/groundwork-water@$PACKAGE_VERSION"
        working-directory: ./docs

      - name: Verify installed Groundwork Water version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.package_version }}
        working-directory: ./docs
        run: |
          installed_version=$(node -p \
            "require('./node_modules/@usace-watermanagement/groundwork-water/package.json').version")

          if [[ "$EXPECTED_VERSION" != "latest" && "$installed_version" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Expected Groundwork Water $EXPECTED_VERSION, but installed $installed_version."
            exit 1
          fi

          echo "Deploying Groundwork Water $installed_version" >> "$GITHUB_STEP_SUMMARY"

      - name: Build project
        env:
          VITE_HOMEPAGE: "https://usace-watermanagement.github.io/groundwork-water"
        run: npx vite build
        working-directory: ./docs

      - name: Upload production-ready build files
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
